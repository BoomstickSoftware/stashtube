# Build, scan, push, pin the k8s deployment to the pushed digest (pattern: kataroom), then wait
# for the rollout and smoke-test it, so a broken route is noticed in minutes, not hours.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: flix-deploy
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: docker-build
    steps:
      - name: build image, scan, push to Forgejo registry, bump k8s
        id: build
        shell: sh
        env:
          IMAGE: git.lan:3000/zbmowrey/flix
          SHA: ${{ github.sha }}
          # Write token (write:repository, write:package): registry push + the k8s commit.
          # Registry push and the clone of this repo: a write:package + read:repository
          # token. The k8s tag bump uses deploy-bot, which can push only the image-pin
          # files on k8s main (k8s docs/argocd.md, Branch protection). CI_TOKEN is the
          # pre-2026-11 fallback until it's deleted.
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.CI_TOKEN }}
          K8S_DEPLOY_TOKEN: ${{ secrets.K8S_DEPLOY_TOKEN || secrets.CI_TOKEN }}
          DOCKER_BUILDKIT: '1'
        run: |
          set -e
          apk add --no-cache git
          rm -rf src k8s
          git clone "http://oauth2:${REGISTRY_TOKEN}@git.lan:3000/zbmowrey/flix.git" src
          cd src && git checkout "$SHA"
          echo "$REGISTRY_TOKEN" | docker login git.lan:3000 -u zbmowrey --password-stdin
          # GIT_SHA is what /healthz reports, which the smoke step below waits for.
          docker build --pull --build-arg "GIT_SHA=$SHA" -t "$IMAGE:$SHA" .
          # Scan before pushing, so a failed scan publishes nothing.
          # The vulnerability DB (131 MB, refreshed every 6 h) is kept in a named volume on
          # each runner replica's dind, so most runs download nothing. When it does download:
          # Docker Hub first; trivy's default mirrors (mirror.gcr.io, ghcr.io) crawled at
          # 15-200 KiB/s from this ISP on 2026-10-31 and the default 5 min timeout failed two
          # runs in a row, while Docker Hub served it in 33 s. The timeout covers the download.
          # The scan is retried: the same evening a run died in 18 s because the job network
          # resolved Docker Hub's CDN to an IPv6 address it cannot reach. A real finding also
          # exits 1 and so costs two extra quick scans before the step fails; that is fine.
          scan() {
            docker run --rm -i \
              --add-host=git.lan:192.168.1.151 \
              -v /dind-sock/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache/trivy \
              -e IMAGE_REF="$IMAGE:$SHA" \
              --entrypoint sh \
              aquasec/trivy:0.71.1 -c \
                'cat > /tmp/trivyignore.yaml; exec trivy image \
                   --image-src docker \
                   --ignorefile /tmp/trivyignore.yaml \
                   --db-repository docker.io/aquasec/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2 \
                   --timeout 15m \
                   --exit-code 1 \
                   --severity CRITICAL,HIGH \
                   --ignore-unfixed \
                   "$IMAGE_REF"' \
              < .trivyignore.yaml
          }
          n=0
          until scan; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "scan failed $n times; not pushing"; exit 1; fi
            echo "scan attempt $n failed (a finding, or the DB download); retrying in 30 s"
            sleep 30
          done
          docker push "$IMAGE:$SHA"
          # Pin to content: the cluster pulls tag@digest, so re-pushing a tag changes nothing.
          DIGEST=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$SHA" \
            | awk -v p="${IMAGE}@" 'index($0, p) == 1 { print substr($0, length(p) + 1); exit }')
          expr "$DIGEST" : 'sha256:[0-9a-f]\{64\}$' >/dev/null \
            || { echo "no sha256 digest for the pushed image (got '$DIGEST'); refusing to bump k8s"; exit 1; }
          echo "image: $IMAGE:$SHA@$DIGEST"
          cd ..
          git clone "http://oauth2:${K8S_DEPLOY_TOKEN}@git.lan:3000/zbmowrey/k8s.git" k8s
          cd k8s
          sed -i "s|^          image: git.lan:3000/zbmowrey/flix.*|          image: ${IMAGE}:${SHA}@${DIGEST}|" infra/flix/deployment.yaml
          grep -q "image: ${IMAGE}:${SHA}@${DIGEST}" infra/flix/deployment.yaml \
            || { echo "image line not found in infra/flix/deployment.yaml"; exit 1; }
          if git diff --quiet; then
            echo "flix image unchanged (${SHA}); nothing to commit"
          else
            git -c user.name="forgejo-actions" -c user.email="actions@git.lan" commit -a \
              -m "deploy: update flix image to ${SHA}" -m "${IMAGE}@${DIGEST}"
            git push
          fi
      - name: wait for the rollout, then smoke-test it
        id: smoke
        shell: sh
        env:
          SHA: ${{ github.sha }}
          # flix's LoadBalancer address, what flix.lan resolves to on the LAN: the same path a
          # phone takes. Job containers sit on dind's bridge with public DNS, so `.lan` names do
          # not resolve here (the trivy step needs --add-host for git.lan too), but the LAN IP
          # routes, and flix answers on it without a Host header.
          FLIX: http://192.168.1.152
        run: |
          set -e
          command -v curl >/dev/null 2>&1 || apk add --no-cache curl >/dev/null
          # ArgoCD notices the k8s commit on its next poll (up to 3 min), then the pod restarts
          # behind a startup probe. A rollout took under 2 min today; give up after 8.
          i=0
          until curl -sf -m 5 "$FLIX/healthz" | grep -q "\"version\":\"$SHA\""; do
            i=$((i + 1))
            if [ "$i" -gt 96 ]; then
              echo "rollout of $SHA not seen after 8 min; /healthz says: $(curl -s -m 5 "$FLIX/healthz")"
              exit 1
            fi
            sleep 5
          done
          echo "running $SHA after $((i * 5)) s"
          # The routes behind every page's first paint: the SPA, home, browse facets and tiles, the
          # three directories and search. Each goes through Stash and the caches, so any filter or
          # query Stash rejects shows up here as a non-200. If flix ever gets FLIX_PASSWORD, the
          # /api routes answer 401 instead; that is reported, not failed, until this step logs in.
          fail=0
          for p in /readyz / /api/home /api/tags/tiles '/api/tags?perPage=3' '/api/search?q=a' \
                   /api/scenes/facets '/api/performers?perPage=3' '/api/studios?perPage=3'; do
            code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' "$FLIX$p") || code=000
            case "$code" in
              200) echo "ok   $code $p" ;;
              401) case "$p" in /api/*) echo "lock $code $p (password set; not checked)" ;; *) echo "FAIL $code $p"; fail=1 ;; esac ;;
              *) echo "FAIL $code $p"; fail=1 ;;
            esac
          done
          [ "$fail" = 0 ] || { echo "smoke test failed: flix $SHA is live but broken"; exit 1; }
      - name: notify forge on failure
        if: ${{ failure() }}
        shell: sh
        env:
          FORGE_WEBHOOK: ${{ secrets.DISCORD_FORGE_WEBHOOK }}
          BUILD: ${{ steps.build.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          [ -n "$FORGE_WEBHOOK" ] || { echo "DISCORD_FORGE_WEBHOOK unset; skipping"; exit 0; }
          if [ "$BUILD" != "success" ]; then
            WHAT="FAILED on main (build/scan/push/tag-bump) — not deployed"
          elif [ "$SMOKE" != "success" ]; then
            WHAT="DEPLOYED on main but the smoke test FAILED (a route is broken or the rollout never came up) — check flix.lan"
          else
            WHAT="FAILED on main"
          fi
          PAYLOAD="{\"content\":\"🚨 **flix** deploy pipeline ${WHAT} — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_NUMBER}\"}"
          command -v curl >/dev/null 2>&1 || apk add --no-cache curl >/dev/null 2>&1 || true
          curl -sf -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$FORGE_WEBHOOK" \
            || wget -q -O /dev/null --header='Content-Type: application/json' --post-data="$PAYLOAD" "$FORGE_WEBHOOK" \
            || true
