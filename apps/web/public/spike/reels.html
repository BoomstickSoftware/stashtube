<!doctype html>
<!-- Reels M0 spike (wiki/reels-engineering-roadmap.md): can two <video> elements play clips from
     different files back to back on the iPhone, with a cut, a fade and a dissolve, and keep their
     sound? Throwaway: removed before M1 merges. It shows ids and numbers only, never a title. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>reels spike</title>
    <style>
      body { margin: 0; background: #0b0d10; color: #e6ebf0; font: 15px/1.45 system-ui, sans-serif; padding: 12px; padding-top: max(12px, env(safe-area-inset-top)); }
      .stage { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
      video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
      button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: #e6ebf0; color: #000; }
      button.q { background: #1c232b; color: #e6ebf0; }
      button[disabled] { opacity: 0.4; }
      label { display: flex; gap: 8px; align-items: center; min-height: 44px; }
      pre { white-space: pre-wrap; word-break: break-word; background: #141a20; border-radius: 10px; padding: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; min-height: 6em; }
      #now { font-variant-numeric: tabular-nums; color: #9aa6b2; }
      h2 { font-size: 15px; margin: 16px 0 6px; }
    </style>
  </head>
  <body>
    <div class="stage"><video id="va" playsinline preload="auto"></video><video id="vb" playsinline preload="auto"></video></div>
    <div class="row">
      <button id="start">Start</button>
      <button id="stop" class="q" disabled>Stop</button>
      <span id="now">idle</span>
    </div>
    <div class="row">
      <label><input type="checkbox" id="wa" /> Route sound through Web Audio (lets a fade change the volume on an iPhone)</label>
    </div>
    <p>It plays seven 8-second clips from three videos: cut, fade, dissolve, then the same again. Watch and listen at each change, then answer below and copy the results.</p>
    <h2>What you saw and heard</h2>
    <div class="row" id="answers"></div>
    <div class="row"><button id="copy" class="q">Copy results</button></div>
    <pre id="log"></pre>
    <script>
      const $ = (id) => document.getElementById(id)
      const els = [$('va'), $('vb')]
      const lines = []
      const log = (s) => { lines.push(s); $('log').textContent = lines.join('\n') }
      const now = () => performance.now()
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms))
      // resolves with the event, or 'timeout'
      const once = (el, ev, ms = 6000) => new Promise((res) => {
        const t = setTimeout(() => { el.removeEventListener(ev, h); res('timeout') }, ms)
        const h = () => { clearTimeout(t); res(ev) }
        el.addEventListener(ev, h, { once: true })
      })
      // the next frame the element actually presents
      const frame = (el, ms = 6000) => new Promise((res) => {
        const t = setTimeout(() => res('timeout'), ms)
        if (el.requestVideoFrameCallback) el.requestVideoFrameCallback(() => { clearTimeout(t); res('frame') })
        else el.addEventListener('timeupdate', () => { clearTimeout(t); res('timeupdate') }, { once: true })
      })

      const CLIP = 8
      const ORDER = ['cut', 'fade', 'dissolve', 'cut', 'fade', 'dissolve']
      const FADE = 300, DISSOLVE = 600
      let running = false, audio = null

      // answers the viewer gives, part of the copied results
      const QUESTIONS = { sound: 'Sound in every clip', cut: 'Cuts clean', fade: 'Fades smooth', dissolve: 'Dissolves smooth', overlap: 'Both sounds during dissolve' }
      const answers = {}
      for (const [k, label] of Object.entries(QUESTIONS)) {
        const b = document.createElement('button')
        b.className = 'q'
        const paint = () => (b.textContent = `${label}: ${answers[k] ?? '?'}`)
        b.onclick = () => { answers[k] = answers[k] === 'yes' ? 'no' : answers[k] === 'no' ? 'partly' : 'yes'; paint() }
        paint()
        $('answers').append(b)
      }

      async function pickScenes() {
        const want = new URLSearchParams(location.search).get('ids')
        let ids = want ? want.split(',') : []
        if (!ids.length) {
          const r = await fetch('/api/scenes?perPage=40&sort=random')
          if (!r.ok) throw new Error(`scene list: HTTP ${r.status}${r.status === 401 ? ' (sign in to flix on this address first)' : ''}`)
          ids = (await r.json()).items.map((s) => s.id)
        }
        const out = []
        for (const id of ids) {
          if (out.length === 3) break
          const r = await fetch(`/api/scenes/${id}`)
          if (!r.ok) continue
          const s = await r.json()
          const p = s.playback
          if (!want && !(p.container === 'mp4' && p.videoCodec === 'h264' && s.durationSec > 180)) continue
          const u = new URL(p.direct, location.href)
          out.push({ id: s.id, dur: s.durationSec, h: s.height, src: u.pathname + u.search }) // same origin: Web Audio is silent on cross-origin media
        }
        if (out.length < 3) throw new Error(`only ${out.length} playable videos found`)
        return out
      }

      // load a clip into an element and park it at its start
      async function prepare(el, clip) {
        const t0 = now()
        el.style.opacity = 0
        el.src = clip.src
        el.load()
        const meta = await once(el, 'loadedmetadata')
        if (meta === 'timeout') return { ms: Math.round(now() - t0), state: 'no metadata until played' }
        el.currentTime = clip.start
        const seeked = await once(el, 'seeked', 4000)
        if (el.readyState < 3) await once(el, 'canplay', 3000)
        return { ms: Math.round(now() - t0), state: seeked === 'timeout' ? 'seek pending' : `ready(${el.readyState})` }
      }

      const setVol = (i, v) => { if (audio) audio.gains[i].gain.value = v; else els[i].volume = v }
      function ramp(ms, fn) {
        return new Promise((res) => {
          const t0 = now()
          const step = () => { const k = Math.min(1, (now() - t0) / ms); fn(k); k < 1 ? requestAnimationFrame(step) : res() }
          requestAnimationFrame(step)
        })
      }
      const playResult = (el) => el.play().then(() => 'ok', (e) => e.name)

      // start an element; if the browser refuses it with sound, say so and try it muted
      async function begin(el) {
        const r = await playResult(el)
        if (r === 'ok') return r
        el.muted = true
        return `${r}>muted:${await playResult(el)}`
      }
      // let an element play up to a time; a pause nobody asked for is logged and undone, a stall ends the run
      async function playUntil(el, t) {
        let last = el.currentTime, since = now(), resumed = 0
        while (running && el.currentTime < t) {
          await new Promise(requestAnimationFrame)
          if (el.paused && !el.ended) {
            if (++resumed > 3) throw new Error(`video keeps pausing at ${el.currentTime.toFixed(1)}s`)
            log(`  paused by the browser at ${el.currentTime.toFixed(1)}s, resume:${await playResult(el)}`)
          }
          if (el.currentTime !== last) { last = el.currentTime; since = now() }
          else if (now() - since > 8000) throw new Error(`stalled at ${last.toFixed(1)}s readyState=${el.readyState} networkState=${el.networkState} paused=${el.paused}`)
        }
      }

      async function run() {
        running = true
        $('start').disabled = true
        $('stop').disabled = false
        lines.length = 0
        const probe = document.createElement('video')
        probe.volume = 0.5
        log(`env volumeSettable=${probe.volume === 0.5} frameCallback=${'requestVideoFrameCallback' in HTMLVideoElement.prototype} webAudio=${$('wa').checked} standalone=${matchMedia('(display-mode: standalone)').matches} ${innerWidth}x${innerHeight}`)
        log(`ua ${navigator.userAgent.replace(/^Mozilla\/5.0 /, '').slice(0, 90)}`)

        // inside the tap: both elements are started once, so later play() calls need no gesture
        if ($('wa').checked && !audio) {
          const ctx = new (window.AudioContext || window.webkitAudioContext)()
          const gains = els.map((el) => { const g = ctx.createGain(); ctx.createMediaElementSource(el).connect(g).connect(ctx.destination); return g })
          audio = { ctx, gains }
          ctx.resume()
        }
        const scenes = ready
        log(`scenes ${scenes.map((s) => `${s.id}(${s.h}p)`).join(' ')}${audio ? ` audioContext=${audio.ctx.state}` : ''}`)
        const clips = Array.from({ length: ORDER.length + 1 }, (_, i) => { const s = scenes[i % 3]; const start = Math.floor(s.dur * [0.3, 0.55, 0.75][Math.floor(i / 3) % 3]); return { ...s, start, end: start + CLIP } })

        // Still inside the tap, before anything is awaited: both elements get a source and a play()
        // call, so the browser counts both as started by the user. B is paused again as soon as it runs.
        let cur = 0
        const t0 = now()
        els.forEach((el, i) => { el.muted = i === 1; el.style.opacity = i === 0 ? 1 : 0; el.src = clips[i].src })
        setVol(0, 1); setVol(1, 0)
        const pa = playResult(els[0])
        const pb = playResult(els[1]).then((r) => { els[1].pause(); els[1].muted = false; return r })
        const [r0, r1] = await Promise.all([pa, pb])
        if (els[0].readyState < 1) await once(els[0], 'loadedmetadata')
        els[0].currentTime = clips[0].start
        await once(els[0], 'seeked', 4000)
        log(`#0 start ${clips[0].id} ready ${Math.round(now() - t0)}ms play:${r0} primeSecond:${r1} firstPausedByPrime=${els[0].paused}`)

        for (let i = 0; i < ORDER.length && running; i++) {
          const kind = ORDER[i], a = els[cur], b = els[1 - cur], next = clips[i + 1]
          const prep = await prepare(b, next) // while A plays
          const lead = kind === 'dissolve' ? DISSOLVE / 1000 : kind === 'fade' ? FADE / 1000 : 0
          $('now').textContent = `clip ${i + 1} of ${ORDER.length + 1}, next: ${kind}`
          await playUntil(a, clips[i].end - lead)
          if (!running) break
          const t0 = now()
          let gap = 0, played = '', note = ''
          if (kind === 'cut') {
            setVol(1 - cur, 1)
            b.muted = false; played = await begin(b)
            const f = await frame(b)
            b.style.opacity = 1; a.style.opacity = 0; a.pause()
            gap = Math.round(now() - t0); note = f
          } else if (kind === 'fade') {
            await ramp(FADE, (k) => { a.style.opacity = 1 - k; setVol(cur, 1 - k) })
            a.pause()
            const t1 = now()
            setVol(1 - cur, 0)
            b.muted = false; played = await begin(b)
            const f = await frame(b)
            gap = Math.round(now() - t1); note = `${f} black`
            await ramp(FADE, (k) => { b.style.opacity = k; setVol(1 - cur, k) })
          } else {
            setVol(1 - cur, 0)
            b.style.zIndex = 2; a.style.zIndex = 1
            b.muted = false; played = await begin(b)
            const f = await frame(b)
            gap = Math.round(now() - t0)
            const aStopped = a.paused // iOS may pause the first video when a second one starts with sound
            await ramp(DISSOLVE, (k) => { b.style.opacity = k; setVol(1 - cur, k); setVol(cur, 1 - k) })
            note = `${f} firstPausedBySecond=${aStopped || a.paused}`
            a.pause(); a.style.opacity = 0
          }
          log(`#${i + 1} ${kind} ${clips[i].id}>${next.id} prep ${prep.ms}ms ${prep.state} play:${played} wait ${gap}ms ${note}`)
          cur = 1 - cur
        }
        // let the last clip run out
        const last = els[cur]
        await playUntil(last, clips.at(-1).end)
        log(running ? 'done' : 'stopped')
        stop()
      }
      function stop() {
        running = false
        els.forEach((el) => el.pause())
        $('start').disabled = !ready
        $('stop').disabled = true
        $('now').textContent = 'idle'
      }
      // the videos are chosen before the tap, so the tap itself can start both elements
      let ready = null
      $('start').disabled = true
      $('now').textContent = 'choosing three videos…'
      pickScenes().then(
        (s) => { ready = s; $('start').disabled = false; $('now').textContent = 'ready' },
        (e) => { log(`ERROR ${e.message}`); $('now').textContent = 'cannot start' },
      )
      $('start').onclick = () => run().catch((e) => { log(`ERROR ${e.message}`); stop() })
      $('stop').onclick = stop
      $('copy').onclick = async () => {
        const text = [...lines, `answers ${Object.keys(QUESTIONS).map((k) => `${k}=${answers[k] ?? '?'}`).join(' ')}`].join('\n')
        try { await navigator.clipboard.writeText(text); $('copy').textContent = 'Copied' } catch { $('copy').textContent = 'Select the text below and copy it' }
        $('log').textContent = text
      }
    </script>
  </body>
</html>
